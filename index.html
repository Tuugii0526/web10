<!doctype html>
<html lang="mn" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Намжилдорж Төгөлдөрийн зургийн цомог (Лаб 10)." />
  <title>tuguldurn@lab10:~$ album</title>
  <script>
    document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar border-bottom sticky-top bg-body" aria-label="Хуудасны цэс">
    <div class="container-xl">
      <a class="navbar-brand font-monospace" href="#album"><kbd>tuguldurn@lab10:~$</kbd> ls ./album</a>
      <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button"
        aria-label="Өнгөний горим солих">🌙</button>
    </div>
  </nav>

  <main class="container-xl py-4 d-grid gap-4">
    <section id="album" class="card p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2 mb-1">
        <h1 class="h5 mb-0">📸 Монголын цомог</h1>
        <small id="count" class="text-body-secondary"></small>
      </div>
      <p class="text-body-secondary small mb-3">Карт дээр хулганаа аваачих эсвэл Tab дарж тайлбарыг харна. Зургууд: Wikimedia Commons.</p>

      <!-- Шүүлтүүр (Task 4-т listener холбоно) -->
      <form id="filters" class="row g-2 mb-3" role="search" onsubmit="return false">
        <div class="col-md-5">
          <label for="q" class="visually-hidden">Хайх</label>
          <input id="q" name="q" type="search" class="form-control" placeholder="Нэр, таг-аар хайх…" />
        </div>
        <div class="col-6 col-md-4">
          <label for="place" class="visually-hidden">Газар</label>
          <select id="place" name="place" class="form-select">
            <option value="">Бүх газар</option>
            <option>Улаанбаатар</option>
            <option>Төв</option>
            <option>Баян-Өлгий</option>
            <option>Хөвсгөл</option>
            <option>Өмнөговь</option>
            <option>Өвөрхангай</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label for="sort" class="visually-hidden">Эрэмбэ</label>
          <select id="sort" name="sort" class="form-select">
            <option value="">Анхны дараалал</option>
            <option value="likes">♥ Их → бага</option>
            <option value="date">Огноо: шинэ → хуучин</option>
          </select>
        </div>
      </form>

      <ul id="cards" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 list-unstyled mb-0"></ul>
      <p id="empty" class="text-body-secondary mb-0 d-none">Илэрц олдсонгүй.</p>
    </section>
  </main>

  <footer class="border-top">
    <div class="container-xl py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <small class="text-body-secondary">© 2026 Намжилдорж Төгөлдөр</small>
      <a href="#album">↑ дээш гарах</a>
    </div>
  </footer>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const paint = () => { toggle.textContent = root.getAttribute('data-bs-theme') === 'dark' ? '☀️' : '🌙'; };
    paint();
    toggle.addEventListener('click', () => {
      const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-bs-theme', next);
      localStorage.setItem('theme', next);
      paint();
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
